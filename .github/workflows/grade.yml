name: Autograder

on:
  push:
    paths:
      - 'workspace/**'
      - '.github/workflows/grade.yml'
    paths-ignore:
      - 'autograder/**'
  workflow_dispatch:
    inputs:
      grade-all:
        description: 'Grade every assignment in workspace/assignment.txt'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: grade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grade:
    uses: Marius-Juston/AutomaticGrader/.github/workflows/grade.reusable.yml@master
    with:
      manifest: workspace/assignment.txt
      workspace: workspace
      report-dir: autograder
      grader-ref: master
      force-all: ${{ github.event_name == 'workflow_dispatch' && inputs.grade-all }}
